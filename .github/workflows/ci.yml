name: Heart Disease MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint Python code
        run: ruff check api src tests --select E9,F63,F7,F82

      - name: Run automated tests
        run: python -m pytest -q

      - name: Train and evaluate models
        run: python src/train.py

      - name: Verify model artifacts
        run: |
          test -s models/heart_disease_model.joblib
          test -s models/metrics.json
          python -c "import json; d=json.load(open('models/metrics.json')); assert d['selected_model'] in d['models']; print('Model artifact checks passed:', d['selected_model'])"
      
      - name: Upload model, metrics and evaluation plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-mlops-artifacts
          path: |
            models/heart_disease_model.joblib
            models/metrics.json
            mlflow_artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
